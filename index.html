<!DOCTYPE html>

<title>Sarthi · Magic Bus Mobilization Assistant</title>
<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --tx:#0f172a;
  --nv:#0f172a;
  --mut:#475569;
  --bd:#e2e8f0;
  --pri:#ff6b00;
  --pri-h:#e55e00;
  --pri-l:#fff4ed;
  --pt:#ffffff;
  --hi:#991b1b;
  --hib:#fef2f2;
  --hib-bd:#fecaca;
  --hib-card:#fffbfb;
  --me:#854d0e;
  --meb:#fefce8;
  --meb-bd:#fef08a;
  --lo:#166534;
  --lob:#f0fdf4;
  --lob-bd:#bbf7d0;
  --drop:#475569;
  --dropb:#f1f5f9;
  --dropb-bd:#cbd5e1;
  --re:#0e7490;
  --reb:#ecfeff;
  --reb-bd:#a5f3fc;
  --sh:0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --sh-lg:0 6px 16px -2px rgba(15,23,42,0.1), 0 3px 6px -3px rgba(15,23,42,0.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090e17;
    --card:#131c2e;
    --tx:#f8fafc;
    --nv:#f8fafc;
    --mut:#94a3b8;
    --bd:#223049;
    --pri:#ff7a1a;
    --pri-h:#ff8f3d;
    --pri-l:#2a1a10;
    --pt:#ffffff;
    --hi:#fca5a5;
    --hib:#450a0a;
    --hib-bd:#7f1d1d;
    --hib-card:#1e1014;
    --me:#fde047;
    --meb:#422006;
    --meb-bd:#713f12;
    --lo:#86efac;
    --lob:#052e16;
    --lob-bd:#14532d;
    --drop:#cbd5e1;
    --dropb:#1e293b;
    --dropb-bd:#334155;
    --re:#67e8f9;
    --reb:#083344;
    --reb-bd:#155e75;
    --sh:0 2px 4px rgba(0,0,0,0.4);

  }
}
:root[data-theme="dark"]{
  --bg:#090e17;
  --card:#131c2e;
  --tx:#f8fafc;
  --nv:#f8fafc;
  --mut:#94a3b8;
  --bd:#223049;
  --pri:#ff7a1a;
  --pri-h:#ff8f3d;
  --pri-l:#2a1a10;
  --pt:#ffffff;
  --hi:#fca5a5;
  --hib:#450a0a;
  --hib-bd:#7f1d1d;
  --hib-card:#1e1014;
  --me:#fde047;
  --meb:#422006;
  --meb-bd:#713f12;
  --lo:#86efac;
  --lob:#052e16;
  --lob-bd:#14532d;
  --drop:#cbd5e1;
  --dropb:#1e293b;
  --dropb-bd:#334155;
  --re:#67e8f9;
  --reb:#083344;
  --reb-bd:#155e75;
  --sh:0 2px 4px rgba(0,0,0,0.4);
  --sh-lg:0 10px 24px rgba(0,0,0,0.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Noto Sans Devanagari','Noto Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1120px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:24px;font-weight:700;color:var(--nv);letter-spacing:-0.02em;margin:0 0 10px;line-height:1.3;word-break:break-word}
h2{font-size:18px;font-weight:600;color:var(--nv);letter-spacing:-0.01em;margin:0 0 12px;line-height:1.35;word-break:break-word}
h3{font-size:15px;font-weight:600;color:var(--nv);margin:0 0 6px}
p{margin:8px 0}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:18px;margin-bottom:16px;transition:box-shadow .2s}
.card.high-risk-highlight{border-left:4px solid var(--hi);background:var(--hib-card)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.grid .card{margin:0;padding:16px}
.grid b{font-size:28px;font-weight:700;display:block;color:var(--nv);margin-bottom:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}

/* Tap targets: minimum 44px height */
button, .btn{min-height:44px;padding:10px 18px;border:0;border-radius:10px;background:var(--pri);color:var(--pt);cursor:pointer;font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:6px 6px 6px 0;transition:background .15s,opacity .15s;text-decoration:none;-webkit-tap-highlight-color:transparent}
button:hover{background:var(--pri-h)}
button:disabled, button.loading{opacity:0.6;cursor:not-allowed;pointer-events:none}
button.g{background:transparent;color:var(--nv);border:1px solid var(--bd)}
button.g:hover{background:var(--pri-l);border-color:var(--pri)}
button.sm{min-height:38px;padding:6px 12px;font-size:13px}
input,select,textarea{width:100%;min-height:44px;font:inherit;font-size:14px;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:6px 0;transition:border-color .15s,box-shadow .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
textarea{min-height:110px;resize:vertical}
label{font-size:13px;font-weight:500;color:var(--mut);display:block;margin-top:6px}

/* Accessible Icons */
.ic{width:18px;height:18px;flex:none;stroke-width:2;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;display:inline-block}

/* Status Badges with WCAG AA compliance (Icon + Word + Color) */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600;line-height:1;border:1px solid transparent;white-space:nowrap}
.badge .ic{width:13px;height:13px}
.badge.High{background:var(--hib);color:var(--hi);border-color:var(--hib-bd)}
.badge.Medium{background:var(--meb);color:var(--me);border-color:var(--meb-bd)}
.badge.Low{background:var(--lob);color:var(--lo);border-color:var(--lob-bd)}
.badge.Active{background:var(--lob);color:var(--lo);border-color:var(--lob-bd)}
.badge.Dropped{background:var(--dropb);color:var(--drop);border-color:var(--dropb-bd)}
.badge.ReEngaged{background:var(--reb);color:var(--re);border-color:var(--reb-bd)}
.badge.Neutral{background:var(--bg);color:var(--tx);border-color:var(--bd)}

/* Navigation */
#top{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);z-index:4;box-shadow:var(--sh)}
#top b{font-size:17px;color:var(--nv)}
.lang-switch{display:flex;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:2px;margin-left:auto}
.lang-switch button{background:transparent;color:var(--mut);border:0;border-radius:8px;padding:4px 10px;min-height:36px;margin:0;font-size:12px;font-weight:600}
.lang-switch button.on{background:var(--pri);color:#fff}

#sb{position:fixed;top:0;bottom:0;left:0;width:270px;background:#0b111e;color:#cbd5e1;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 14px;overflow-y:auto;z-index:8;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;gap:4px}
.menu #sb{transform:none}
#sb .br{display:flex;gap:12px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid #1e293b;margin-bottom:8px}
#sb .lg{width:40px;height:40px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
#sb .lg .ic{width:22px;height:22px}
#sb .br b{color:#fff;display:block;font-size:16px;font-weight:700}
#sb .br span{font-size:12px;color:#94a3b8}

/* Grouped navigation headers */
.sb-group{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;padding:10px 12px 4px;margin-top:4px}
#sb a{display:flex;gap:12px;align-items:center;padding:10px 12px;min-height:44px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-size:14px;font-weight:500;transition:background .15s,color .15s}
#sb a .ic{width:18px;height:18px;color:#94a3b8}
#sb a.on{background:var(--pri);color:#ffffff;font-weight:600}
#sb a.on .ic{color:#ffffff}
#sb a:hover:not(.on){background:#1e293b;color:#ffffff}
#sb button.collapse-btn{display:none;margin-top:auto;background:transparent;border:1px solid #334155;color:#cbd5e1;min-height:44px;width:100%}
#sb button.collapse-btn:hover{background:#1e293b}

#bn{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;box-shadow:0 -1px 4px rgba(0,0,0,0.04)}
#bn a{flex:1;text-align:center;padding:8px 4px;min-height:54px;font-size:11px;color:var(--mut);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500}
#bn a .ic{width:20px;height:20px}
#bn a.on{color:var(--pri);font-weight:700;box-shadow:inset 0 -3px var(--pri)}

@media(min-width:820px){
  #top button#menuBtn,#bn{display:none}
  #sb{transform:none;width:260px}
  #sb button.collapse-btn{display:flex}
  main{margin:0 auto 0 280px;padding-bottom:40px}
  .col #sb{width:80px}
  .col #sb .l,.col #sb .sb-group,.col #sb .br>div:last-child{display:none}
  .col #sb a{justify-content:center;padding:12px}
  .col main{margin-left:100px}
  #fab{display:none!important}
}

/* Floating Action Button on phones */
#fab{position:fixed;bottom:72px;right:18px;z-index:6}
.fab-main{width:54px;height:54px;border-radius:27px;background:var(--pri);color:#fff;border:0;box-shadow:var(--sh-lg);display:grid;place-items:center;cursor:pointer;padding:0;margin:0}
.fab-main .ic{width:24px;height:24px}
.fab-menu{display:none;position:absolute;bottom:64px;right:0;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh-lg);padding:8px;min-width:190px;flex-direction:column;gap:4px}
.fab-menu.open{display:flex}
.fab-menu a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px;font-weight:600}
.fab-menu a:hover{background:var(--pri-l);color:var(--pri)}

/* Faster Attendance UI */
.att-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.att-card{display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:12px 16px;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.att-card:hover{border-color:var(--pri)}
.att-card.checked{background:var(--pri-l);border-color:var(--pri)}
.att-card input{display:none}
.att-name{font-weight:600;font-size:15px;color:var(--tx)}
.att-meta{display:flex;align-items:center;gap:6px;margin-top:3px}
.att-status-pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:4px}
.att-card.checked .att-status-pill{background:var(--lob);color:var(--lo);border:1px solid var(--lob-bd)}
.att-card:not(.checked) .att-status-pill{background:var(--dropb);color:var(--drop);border:1px solid var(--dropb-bd)}

/* Step-by-Step Forms */
.wizard-steps{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;padding:0 4px}
.step-item{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut)}
.step-item.active{color:var(--pri)}
.step-dot{width:24px;height:24px;border-radius:12px;background:var(--bd);color:var(--tx);display:grid;place-items:center;font-size:12px;font-weight:700}
.step-item.active .step-dot{background:var(--pri);color:#fff}
.step-pane{display:none}
.step-pane.active{display:block}
.wizard-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px;border-top:1px solid var(--bd);padding-top:12px}

/* Action Cards on Today screen */
.action-card{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:100px;padding:16px;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;box-shadow:var(--sh);text-decoration:none;color:var(--tx);transition:transform .15s,border-color .15s,box-shadow .15s}
.action-card:hover{border-color:var(--pri);box-shadow:var(--sh-lg);transform:translateY(-2px)}
.action-card .ic{width:26px;height:26px;color:var(--pri);margin-bottom:8px}
.action-card b{font-size:15px;color:var(--nv);display:block;margin-bottom:2px}
.action-card span{font-size:12px;color:var(--mut)}

/* Progress bar & dots */
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lo);margin-right:2px;vertical-align:middle}
.dot.x{background:transparent;border:2px solid var(--hi)}
.q{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);align-items:center}
.q:last-child{border-bottom:0}

/* Friendly Empty States */
.empty-state{text-align:center;padding:28px 16px;background:var(--bg);border:1px dashed var(--bd);border-radius:12px;margin:12px 0}
.empty-state .ic{width:36px;height:36px;color:var(--mut);margin-bottom:8px}
.empty-state h3{font-size:16px;color:var(--nv);margin:0 0 4px}
.empty-state p{font-size:13px;color:var(--mut);margin:0 0 14px}
.empty-state button{margin:0 auto}

/* Animated Loading Skeletons */
.skeleton-box{padding:16px;background:var(--bg);border-radius:12px;margin:10px 0}
.skeleton-line{height:14px;background:var(--bd);border-radius:6px;margin-bottom:8px}
.skeleton-line.w-75{width:75%}
.skeleton-line.w-50{width:50%}
.pulse{animation:pulse 1.5s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.95}}

/* Voice wave */
.wave{display:none;gap:4px;align-items:flex-end;height:28px;margin:10px 0}.wave.on{display:flex}
.wave i{width:5px;height:6px;background:var(--pri);border-radius:3px;animation:w 1s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes w{0%,100%{height:6px}50%{height:26px}}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#0f172a;color:#ffffff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;display:flex;align-items:center;gap:8px}
.toast.s{opacity:1;transform:translateX(-50%) translateY(-4px)}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;padding:4px 0}
</style></head><body>

</div>

function riskBadge(level){
  const icon = level === 'High' ? I.alertTriangle : level === 'Medium' ? I.shieldAlert : I.checkCircle;
  const label = level === 'High' ? tr('highRisk') : level === 'Medium' ? tr('medRisk') : tr('lowRisk');
  return `<span class="badge ${level}" role="status">${icon} ${label}</span>`;
}
function statusBadge(status){
  let icon = I.checkCircle, cls = 'Active', label = tr('active');
  if(status === 'Dropped out'){ icon = I.userMinus; cls = 'Dropped'; label = tr('droppedOut'); }
  else if(status === 'At risk'){ icon = I.alertTriangle; cls = 'High'; label = tr('atRisk'); }
  else if(status === 'Re-engaged'){ icon = I.refresh; cls = 'ReEngaged'; label = tr('reEngaged'); }
  return `<span class="badge ${cls}" role="status">${icon} ${label}</span>`;
}

function btnLock(btn, timeout=1200){
  if(!btn||btn.disabled)return false;
  btn.disabled=true;
  btn.classList.add('loading');
  setTimeout(()=>{btn.disabled=false;btn.classList.remove('loading')},timeout);
  return true;
}

const EV=[['Diwali (2026)',1106,1112,'low attendance and travel'],['December school exams',1201,1220,'exam pressure, prefer a short study circle'],['March school exams',301,325,'exam pressure'],['Monsoon',615,930,'waterlogged lanes, prefer in-pocket or indoor venues'],['Ganeshotsav (Sep, dates vary)',905,925,'evening crowding']];
const md=d=>d.getMonth()*100+100+d.getDate(),tchk=v=>{if(!v)return'Pick a date to check it.';const p=String(v).split('-').map(Number);const x=(p.length===3&&!isNaN(p[1]))?p[1]*100+p[2]:md(new Date(v+'T12:00:00'));const h=EV.filter(e=>x>=e[1]&&x<=e[2]);return h.length?'⚠ '+h.map(e=>e[0]+': '+e[3]).join('; '):'No known clash on this date.'};
const ctx=()=>{const t=new Date(),a=md(t),b=md(new Date(+t+30*864e5)),e2=b<a?1231:b,h=EV.filter(e=>a<=e[2]&&e2>=e[1]);return h.length?'Coming up in the next 30 days: '+h.map(e=>e[0]+' ('+e[3]+')').join('; '):'No known school or festival clashes in the next 30 days.'};
const otr=k=>{const x=F.filter(f=>f.c==k&&f.o!='Interested'),N=Date.now(),n=x.filter(f=>f.ts>N-30*864e5).length,e=x.filter(f=>f.ts<=N-30*864e5&&f.ts>N-60*864e5).length;return`Last 30 days: ${n} · previous 30 days: ${e} (${n>e?'rising':n<e?'falling':'steady'})`};
function risk(b){let s=0,r=[],k=0,a=b.a||[];for(let i=a.length-1;i>=0&&!a[i];i--)k++;
if(k>=3){s+=3;r.push(k+' consecutive absences')}else if(k==2){s+=2;r.push('2 consecutive absences')}
if(pct(b)<50){s+=2;r.push('attendance '+pct(b)+'% over last '+a.length+' sessions')}
if(ld(b)>=10){s+=2;r.push('no contact in '+ld(b)+' days')}
const m=(b.note||'').match(/exam|work|job|shift|safety|marriage/i);if(m){s+=1;r.push('notes mention “'+m[0].toLowerCase()+'”')}
return{s,r,level:s>=5?'High':s>=3?'Medium':'Low'}}
const st=b=>b.d?'Dropped out':risk(b).level!='Low'?'At risk':reeng(b)?'Re-engaged':'Active';
const dots=b=>`<span aria-label="attendance ${pct(b)} percent" style="display:inline-flex;align-items:center;gap:2px">${(b.a||[]).map(v=>`<i class="dot ${v?'':'x'}"></i>`).join('')} <span class="mut" style="font-size:12px;margin-left:4px">${pct(b)}%</span></span>`;
function toast(m){const t=$('#t');t.innerHTML=`${I.checkCircle} <span>${esc(m)}</span>`;t.classList.add('s');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('s'),2600)}
async function cp(t){try{await navigator.clipboard.writeText(t);toast('Copied to clipboard')}catch(e){toast('Please select text and copy manually')}}
const cavg=k=>{const x=B.filter(b=>b.c==k);return x.length?Math.round(sum(x.map(pct))/x.length):0};
const themes=c=>{const o={};F.filter(f=>f.c==c&&f.o!='Interested').forEach(f=>o[f.t]=(o[f.t]||0)+1);return o};
const opts=(arr,sel)=>arr.map(a=>`<option value="${a[0]}" ${String(a[0])==String(sel)?'selected':''}>${esc(a[1])}</option>`).join('');
const copts=sel=>opts(Object.keys(C).map(k=>[k,C[k].n]),sel);

let formStep = { p: 1, fb: 1, c: 1 };

function setStep(form, s){
  formStep[form] = s;
  document.querySelectorAll('.' + form + '-pane').forEach(p => p.classList.remove('active'));

function executeSaveAtt(){
  cm();

  document.querySelectorAll('.ck').forEach(x => {
    const bId = +x.value, b = B.find(z => z.id === bId) || B[bId];
    if(!b) return;
    const isPresent = x.checked ? 1 : 0;
    b.hs = (b.hs || []).concat({ d: sd, v: isPresent }).sort((p, q) => p.d - q.d).slice(-24);
    b.a = b.hs.slice(-8).map(h => h.v);
    if(isPresent){
      const sc = Math.min(sd, now);
      b.lcd = Math.max(b.lcd || 0, sc);
    }
    sv('people/p' + b.id, { a: b.a, lcd: b.lcd, hs: b.hs });
  });

  go();
}

let EX=[];
function rx(t){
  return t.split(/[.\n।]+/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const l=s.toLowerCase();
    const b=B.find(x=>l.includes(x.n.toLowerCase()))||B.find(x=>l.includes(x.n.split(' ')[0].toLowerCase()));
    const k=Object.keys(C).find(k=>l.includes(C[k].n.toLowerCase()))||(b&&b.c);
    const isReg=/regist|enrol|join/.test(l);let regName='';
    if(isReg&&!b){
      const m=s.match(/(?:regist\w*|enrol\w*|join\w*)\s+(?:a\s+)?(?:new\s+)?(?:child\s+|girl\s+|boy\s+|student\s+|beneficiary\s+|youth\s+)?([A-Za-z\p{L}]+(?:\s+[A-Za-z\p{L}]+)?)/iu);
      if(m){
        let cand=m[1].trim().replace(/\b(in|at|from|today|yesterday|now)\b.*/i,'').trim();
        Object.values(C).forEach(c=>{cand=cand.replace(new RegExp('\\b'+c.n+'\\b','gi'),'').trim()});
        if(cand.length>1)regName=cand.split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
      }
    }
    return{
      ty:/refus|not interested|declin/.test(l)?'Refusal':isReg?'Registration':/follow|call back|come back|again/.test(l)?'Follow-up':'Visit',
      who:b?b.n:(regName||'(no match)'),
      c:k?C[k].n:'—',
      s,
      id:b?b.id:-1,
      regName
    };
  });
}

function svx(){
  const btn=$('#svxBtn');if(!btnLock(btn))return;
  const selM=+$('#fm').value,defComm=(M[selM]&&M[selM].c)||Object.keys(C)[0];
  document.querySelectorAll('.ek:checked').forEach(x=>{
    const e=EX[+x.value];
    e.m=selM;
    e.ts=Date.now();
    if(e.ty=='Registration'&&e.id<0){
      const ck=Object.keys(C).find(k=>C[k].n==e.c)||defComm;
      let name=e.regName;
      if(!name){
        const mt=e.s.match(/(?:regist\w*|enrol\w*|join\w*)\s+(?:a\s+)?(?:new\s+)?(?:child\s+|girl\s+|boy\s+|student\s+|beneficiary\s+|youth\s+)?([A-Za-z\p{L}]+(?:\s+[A-Za-z\p{L}]+)?)/iu);
        if(mt){
          let cand=mt[1].trim().replace(/\b(in|at|from|today|yesterday|now)\b.*/i,'').trim();
          Object.values(C).forEach(c=>{cand=cand.replace(new RegExp('\\b'+c.n+'\\b','gi'),'').trim()});
          if(cand.length>1)name=cand.split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
        }
      }
      if(!name&&e.who&&e.who!=='(no match)')name=e.who;
      if(name&&ck){
        e.id=mk({n:name,c:ck,rf:'Mobilizer visit'});
        e.who=name;
        e.c=C[ck].n;
      }
    }
    LOG.push(e);
    add('visits',e);
    if(e.id>=0){
      const b=B.find(z=>z.id===e.id)||B[e.id];
      if(b){b.lcd=Date.now();sv('people/p'+b.id,{lcd:b.lcd});}
    }
  });
  toast(live?'Saved to database':'Saved locally (demo mode)');
  go();
}

{t:'Sarthi Mobilization Playbook & Standard Operating Procedures',x:`Sarthi is the Magic Bus Mobilization Assistant for the Mankhurd Centre in Mumbai.
Community mobilization guidelines:
Mobilizers conduct daily door-to-door visits and community engagement across Mandala, Baiganwadi, Lallubhai Compound, and Shivaji Nagar.
Daily target is 3 visits, weekly target is 15 visits, and monthly target is 60 visits.
When parents express safety concerns regarding evening sessions, mobilizers should recommend daytime sessions, parent meet-and-greets, or in-pocket family sessions.
For timing clashes with school or madrasa hours, offer weekend morning or flexible drop-in sessions.
For exam periods in December and March, hold short study circles and exam-stress support sessions.
For monsoon season (June to September), schedule sessions in covered indoor venues or within the residential pockets to avoid waterlogged lanes.
When youth are working or travel fare is a barrier, highlight livelihood placement pathways and offer travel support pilots.`},
{t:'OASYS Attendance & Risk Flag Guidelines',x:`Magic Bus OASYS attendance tracking and early-warning dropout risk model:
Attendance is recorded for each session. Risk scores are calculated based on consecutive absences, overall attendance rate, and gap since last contact.
High risk indicates a risk score of 5 or higher: triggers immediate mobilizer follow-up, home visit, or guardian phone call.
Medium risk indicates a risk score of 3 or 4: placed on the supervisor watchlist.
Low risk indicates active engagement with a score below 3.
A child missing 3 or more consecutive sessions receives 3 risk points. 2 consecutive absences adds 2 points.
Attendance below 50% adds 2 points. No contact in 10 or more days adds 2 points.
Notes indicating exams, work, shifts, or safety concerns add 1 point.
Re-engaged status is assigned when a previously irregular child attends 2 consecutive sessions after prolonged absence.
Dropped-out youth can be reinstated at any time when they resume participation.`}

const reeng=b=>{
  const a=b.a||[];let k=0;for(let i=a.length-1;i>=0&&a[i];i--)k++;if(k<2)return false;
  const r=a.slice(0,a.length-k);let n=0,mx=0;r.forEach(v=>{n=v?0:n+1;mx=Math.max(mx,n)});
  return mx>=3&&r.length>0&&!r[r.length-1];
};

async function askKB(){
  const btn=$('#askBtn');if(!btnLock(btn))return;
  const q=$('#kq').value.trim(),el=$('#ka');if(!q)return;
  const sw=['the','and','what','how','are','for','does','with','this','that','from','can','when'],
        w=q.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(z=>z.length>2&&!sw.includes(z)),
        r=KB.flatMap(d=>d.x.split(/\n+/).filter(p=>p.trim().length>20).map(p=>({t:d.t,x:p.trim()}))).map(c=>({...c,s:w.filter(z=>(c.t+' '+c.x).toLowerCase().includes(z)).length})).filter(c=>c.s>0).sort((a,b)=>b.s-a.s).slice(0,3);

  if(!r.length){
    el.innerHTML=`
      <div class="empty-state">
        ${I.book}
        <h3>No matching passages found</h3>
        <p class="mut">Try searching for words like "safety", "playbook", "OASYS", "attendance", or add a new document below.</p>
      </div>`;
    return;
  }

  const src=r.map(c=>`<p class="mut" style="padding:6px 0;border-bottom:1px solid var(--bd)"><b>[${esc(c.t)}]:</b> ${esc(c.x)}</p>`).join('');
  if(!SA){
    el.innerHTML=`<div class="card" style="margin-top:12px"><h3>Matching guidelines:</h3>${src}</div>`;
    return;
  }
  el.innerHTML=`
    <div class="skeleton-box">
      <div class="skeleton-line pulse"></div>
      <div class="skeleton-line pulse w-75"></div>
      <p class="mut" style="display:flex;align-items:center;gap:6px">${I.sparkles} Synthesizing answer from guidelines...</p>
    </div>`;
  try{
    const x=await SA(`Answer using ONLY passages below. Cite [Doc title].\nQuestion: ${q}\n\n`+r.map((c,i)=>`Passage ${i+1} [${c.t}]: ${c.x}`).join('\n'),{cache:false});
    el.innerHTML=`<div class="card" style="margin-top:12px"><p>${esc(x.text.trim()).replace(/\n/g,'<br>')}</p><details style="margin-top:8px"><summary class="mut">${I.book} Source passages</summary>${src}</details></div>`;
  }catch(e){
    el.innerHTML=`<div class="card" style="margin-top:12px"><h3>Matching guidelines:</h3>${src}</div>`;
  }
}

function addKB(){
  const btn=$('#addKbBtn');if(!btnLock(btn))return;

  const d={t,x};KB.push(d);add('kb',d);toast(live?'Document saved':'Saved locally (demo mode)');go();
}
