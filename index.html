let EX=[];

const isReg=/regist|enrol|join/.test(l);let regName='';
if(isReg&&!b){const m=s.match(/(?:regist\w*|enrol\w*|join\w*)\s+(?:a\s+)?(?:new\s+)?(?:child\s+|girl\s+|boy\s+|student\s+|beneficiary\s+|youth\s+)?([A-Za-z\p{L}]+(?:\s+[A-Za-z\p{L}]+)?)/iu);
if(m){let cand=m[1].trim().replace(/\b(in|at|from|today|yesterday|now)\b.*/i,'').trim();Object.values(C).forEach(c=>{cand=cand.replace(new RegExp('\\b'+c.n+'\\b','gi'),'').trim()});if(cand.length>1)regName=cand.split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ')}}
return{ty:/refus|not interested|declin/.test(l)?'Refusal':isReg?'Registration':/follow|call back|come back|again/.test(l)?'Follow-up':'Visit',who:b?b.n:(regName||'(no match)'),c:k?C[k].n:'—',s,id:b?b.id:-1,regName}})}

const enr=()=>{const g={},E=B.filter(b=>b.en);[...E].sort((x,y)=>x.en-y.en).forEach(b=>{const m=mon(b.en);(g[m]=g[m]||[]).push(b)});return `<div class=card><h2>Enrollment and retention by month joined</h2>${Object.entries(g).map(([m,x])=>{const r=Math.round(x.filter(b=>!b.d).length/x.length*100);return `<p><b>${m}</b> · ${x.length} enrolled · ${r}% retained</p><div class=bar><i style=width:${r}%></i></div>`}).join('')}<h2>Recent enrollments</h2>${[...E].sort((x,y)=>y.en-x.en).slice(0,6).map(b=>`<p>${esc(b.n)} · <span class=mut>${C[b.c]?C[b.c].n:b.c} · ${b.p} · ${dt(b.en)}${b.rf?' · via '+esc(b.rf):''}</span></p>`).join('')}</div>`};
const att2=()=>`<div class=card><h2>Attendance by community and program</h2>${Object.keys(C).map(k=>`<p><b>${C[k].n}</b><br><span class=mut>${prog.map(p=>{const x=B.filter(b=>b.c==k&&b.p==p&&!b.d);return p+': '+(x.length?Math.round(sum(x.map(pct))/x.length)+'%':'—')}).join(' · ')}</span></p>`).join('')}</div>`;
function rep(){const tr=k=>{const x=B.filter(b=>b.c==k&&(b.a||[]).length>=8),f=(s,e)=>x.length?Math.round(sum(x.map(b=>sum(b.a.slice(s,e))/(e-s)))/x.length*100):0;return[f(0,4),f(4,8)]},ch={};F.filter(f=>f.r).forEach(f=>ch[f.r]=(ch[f.r]||0)+1);B.forEach(b=>{if(b.rf&&B.some(x=>x.n==b.rf))ch[b.rf]=(ch[b.rf]||0)+1});
const bars=r=>`<div>${r[0]} <span class=mut>${r[1]}%</span><div class=bar><i style=width:${r[1]}%></i></div></div>`;
return `<h1>Reports</h1><div class=card><h2>Summary for supervisor</h2><div id=rs><p class=mut>Generate a plain-language summary of these numbers.</p></div><button onclick=aiRep()>✨ Generate AI summary</button></div>
${enr()}${att2()}<div class=card><h2>Program-wise</h2>${prog.map(p=>{const x=B.filter(b=>b.p==p),at=x.length?Math.round(sum(x.map(pct))/x.length):0,rt=x.length?Math.round(x.filter(b=>!b.d).length/x.length*100):0;return `<p><b>${p}</b> · ${x.length} enrolled</p>`+bars(['Average attendance',at])+bars(['Retention (not dropped out)',rt])}).join('')}</div>
<div class=card><h2>Community-wise</h2>${Object.keys(C).map(k=>{const t=tr(k),x=B.filter(b=>b.c==k);return `<p><b>${C[k].n}</b> · ${x.length} enrolled · ${x.filter(b=>b.d).length} dropped out<br><span class=mut>Participation ${t[0]}% earlier, ${t[1]}% latest (${t[1]>t[0]?'rising':t[1]<t[0]?'falling':'steady'})</span></p>`}).join('')}</div>
<div class=card><h2>Mobilizer performance</h2>${mperf()}</div>
<div class=card><h2>Community champions and referrals</h2>${Object.entries(ch).sort((a,b)=>b[1]-a[1]).map(e=>`<p>${esc(e[0])} <span class=badge>${e[1]} referral${e[1]>1?'s':''}</span></p>`).join('')||'<p class=mut>None logged yet. Add a referrer when saving feedback.</p>'}</div>`}

const NAV=[['dashboard','🏠','Home'],['team','🗺️','Map'],['planner','📅','Planner'],['field','🎤','Voice'],['people','👥','People']];

const KB=[
{t:'Sarthi Mobilization Playbook & Standard Operating Procedures',x:`Sarthi is the Magic Bus Mobilization Assistant for the Mankhurd Centre in Mumbai.
Community mobilization guidelines:
Mobilizers conduct daily door-to-door visits and community engagement across Mandala, Baiganwadi, Lallubhai Compound, and Shivaji Nagar.
Daily target is 3 visits, weekly target is 15 visits, and monthly target is 60 visits.
When parents express safety concerns regarding evening sessions, mobilizers should recommend daytime sessions, parent meet-and-greets, or in-pocket family sessions.
For timing clashes with school or madrasa hours, offer weekend morning or flexible drop-in sessions.
For exam periods in December and March, hold short study circles and exam-stress support sessions.
For monsoon season (June to September), schedule sessions in covered indoor venues or within the residential pockets to avoid waterlogged lanes.
When youth are working or travel fare is a barrier, highlight livelihood placement pathways and offer travel support pilots.`},
{t:'OASYS Attendance & Risk Flag Guidelines',x:`Magic Bus OASYS attendance tracking and early-warning dropout risk model:
Attendance is recorded for each session. Risk scores are calculated based on consecutive absences, overall attendance rate, and gap since last contact.
High risk indicates a risk score of 5 or higher: triggers immediate mobilizer follow-up, home visit, or guardian phone call.
Medium risk indicates a risk score of 3 or 4: placed on the supervisor watchlist.
Low risk indicates active engagement with a score below 3.
A child missing 3 or more consecutive sessions receives 3 risk points. 2 consecutive absences adds 2 points.
Attendance below 50% adds 2 points. No contact in 10 or more days adds 2 points.
Notes indicating exams, work, shifts, or safety concerns add 1 point.
Re-engaged status is assigned when a previously irregular child attends 2 consecutive sessions after prolonged absence.
Dropped-out youth can be reinstated at any time when they resume participation.`}
];

<p>${Object.entries(th).map(e=>`<span class=badge>${e[0]} ×${e[1]}</span>`).join(' ')||'<span class=mut>No objections logged</span>'}</p>

${x.map(b=>`<div class=q><span>${esc(b.n)}</span><span class="badge ${risk(b).level}">${risk(b).level}</span></div>`).join('')}
<button class=g onclick="pc='${k}';location.hash='planner'">Plan a session</button></details>`}).join('')}
