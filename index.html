<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarthi · Magic Bus Mobilization Assistant</title>
<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --tx:#0f172a;
  --nv:#0f172a;
  --mut:#475569;
  --bd:#e2e8f0;
  --pri:#ff6b00;
  --pri-h:#e55e00;
  --pri-l:#fff4ed;
  --pt:#ffffff;
  --hi:#991b1b;
  --hib:#fef2f2;
  --hib-bd:#fecaca;
  --hib-card:#fffbfb;
  --me:#854d0e;
  --meb:#fefce8;
  --meb-bd:#fef08a;
  --lo:#166534;
  --lob:#f0fdf4;
  --lob-bd:#bbf7d0;
  --drop:#475569;
  --dropb:#f1f5f9;
  --dropb-bd:#cbd5e1;
  --re:#0e7490;
  --reb:#ecfeff;
  --reb-bd:#a5f3fc;
  --sh:0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --sh-lg:0 4px 6px -1px rgba(15,23,42,0.08), 0 2px 4px -2px rgba(15,23,42,0.04);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090e17;
    --card:#131c2e;
    --tx:#f8fafc;
    --nv:#f8fafc;
    --mut:#94a3b8;
    --bd:#223049;
    --pri:#ff7a1a;
    --pri-h:#ff8f3d;
    --pri-l:#2a1a10;
    --pt:#ffffff;
    --hi:#fca5a5;
    --hib:#450a0a;
    --hib-bd:#7f1d1d;
    --hib-card:#1e1014;
    --me:#fde047;
    --meb:#422006;
    --meb-bd:#713f12;
    --lo:#86efac;
    --lob:#052e16;
    --lob-bd:#14532d;
    --drop:#cbd5e1;
    --dropb:#1e293b;
    --dropb-bd:#334155;
    --re:#67e8f9;
    --reb:#083344;
    --reb-bd:#155e75;
    --sh:0 2px 4px rgba(0,0,0,0.4);
    --sh-lg:0 8px 16px rgba(0,0,0,0.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090e17;
  --card:#131c2e;
  --tx:#f8fafc;
  --nv:#f8fafc;
  --mut:#94a3b8;
  --bd:#223049;
  --pri:#ff7a1a;
  --pri-h:#ff8f3d;
  --pri-l:#2a1a10;
  --pt:#ffffff;
  --hi:#fca5a5;
  --hib:#450a0a;
  --hib-bd:#7f1d1d;
  --hib-card:#1e1014;
  --me:#fde047;
  --meb:#422006;
  --meb-bd:#713f12;
  --lo:#86efac;
  --lob:#052e16;
  --lob-bd:#14532d;
  --drop:#cbd5e1;
  --dropb:#1e293b;
  --dropb-bd:#334155;
  --re:#67e8f9;
  --reb:#083344;
  --reb-bd:#155e75;
  --sh:0 2px 4px rgba(0,0,0,0.4);
  --sh-lg:0 8px 16px rgba(0,0,0,0.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Noto Sans Devanagari','Noto Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1120px;margin:0 auto;padding:20px 16px 100px}
h1{font-size:24px;font-weight:700;color:var(--nv);letter-spacing:-0.02em;margin:0 0 10px;line-height:1.25}
h2{font-size:18px;font-weight:600;color:var(--nv);letter-spacing:-0.01em;margin:0 0 12px;line-height:1.35}
h3{font-size:15px;font-weight:600;color:var(--nv);margin:0 0 6px}
p{margin:8px 0}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:18px;margin-bottom:16px;transition:box-shadow .2s}
.card.high-risk-highlight{border-left:4px solid var(--hi);background:var(--hib-card)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.grid .card{margin:0;padding:16px}
.grid b{font-size:28px;font-weight:700;display:block;color:var(--nv);margin-bottom:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}

/* Tap targets: minimum 44px height */
button, .btn{min-height:44px;padding:10px 18px;border:0;border-radius:10px;background:var(--pri);color:var(--pt);cursor:pointer;font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:6px 6px 6px 0;transition:background .15s,opacity .15s;text-decoration:none;-webkit-tap-highlight-color:transparent}
button:hover{background:var(--pri-h)}
button:disabled, button.loading{opacity:0.6;cursor:not-allowed;pointer-events:none}
button.g{background:transparent;color:var(--nv);border:1px solid var(--bd)}
button.g:hover{background:var(--pri-l);border-color:var(--pri)}
button.sm{min-height:36px;padding:6px 12px;font-size:13px}
input,select,textarea{width:100%;min-height:44px;font:inherit;font-size:14px;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:6px 0;transition:border-color .15s,box-shadow .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
textarea{min-height:120px;resize:vertical}
label{font-size:13px;font-weight:500;color:var(--mut);display:block;margin-top:6px}

/* Accessible Icons */
.ic{width:18px;height:18px;flex:none;stroke-width:2;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;display:inline-block}
.ic-lg{width:22px;height:22px}
.ic-sm{width:14px;height:14px}

/* Status Badges with WCAG AA compliance (Icon + Word + Color) */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600;line-height:1;border:1px solid transparent;white-space:nowrap}
.badge .ic{width:13px;height:13px}
.badge.High{background:var(--hib);color:var(--hi);border-color:var(--hib-bd)}
.badge.Medium{background:var(--meb);color:var(--me);border-color:var(--meb-bd)}
.badge.Low{background:var(--lob);color:var(--lo);border-color:var(--lob-bd)}
.badge.Active{background:var(--lob);color:var(--lo);border-color:var(--lob-bd)}
.badge.Dropped{background:var(--dropb);color:var(--drop);border-color:var(--dropb-bd)}
.badge.ReEngaged{background:var(--reb);color:var(--re);border-color:var(--reb-bd)}
.badge.Neutral{background:var(--bg);color:var(--tx);border-color:var(--bd)}

/* Navigation */
#top{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);z-index:4;box-shadow:var(--sh)}
#top button{background:transparent;color:var(--nv);padding:8px;margin:0;min-height:44px;min-width:44px}
#top b{font-size:17px;color:var(--nv)}
#sb{position:fixed;top:0;bottom:0;left:0;width:260px;background:#0b111e;color:#cbd5e1;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 14px;overflow-y:auto;z-index:8;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;gap:3px}
.menu #sb{transform:none}
#sb .br{display:flex;gap:12px;align-items:center;padding:6px 8px 18px;border-bottom:1px solid #1e293b;margin-bottom:8px}
#sb .lg{width:40px;height:40px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
#sb .lg .ic{width:22px;height:22px}
#sb .br b{color:#fff;display:block;font-size:16px;font-weight:700}
#sb .br span{font-size:12px;color:#94a3b8}
#sb a{display:flex;gap:12px;align-items:center;padding:11px 14px;min-height:44px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-size:14px;font-weight:500;transition:background .15s,color .15s}
#sb a .ic{width:18px;height:18px;color:#94a3b8}
#sb a.on{background:var(--pri);color:#ffffff;font-weight:600}
#sb a.on .ic{color:#ffffff}
#sb a:hover:not(.on){background:#1e293b;color:#ffffff}
#sb button{display:none;margin-top:auto;background:transparent;border:1px solid #334155;color:#cbd5e1;min-height:44px}
#sb button:hover{background:#1e293b}
#bn{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;box-shadow:0 -1px 4px rgba(0,0,0,0.04)}
#bn a{flex:1;text-align:center;padding:8px 4px;min-height:52px;font-size:11px;color:var(--mut);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500}
#bn a .ic{width:20px;height:20px}
#bn a.on{color:var(--pri);font-weight:700;box-shadow:inset 0 -3px var(--pri)}
@media(min-width:820px){
  #top,#bn{display:none}
  #sb{transform:none;width:250px}
  #sb button{display:flex}
  main{margin:0 auto 0 270px;padding-bottom:40px}
  .col #sb{width:78px}
  .col #sb .l,.col #sb .br>div:last-child{display:none}
  .col #sb a{justify-content:center;padding:11px}
  .col main{margin-left:98px}
}

/* Attendance single-hand touch list */
.att-list{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.att-row{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:12px 16px;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.att-row:hover{border-color:var(--pri)}
.att-row.checked{background:var(--pri-l);border-color:var(--pri)}
.att-row input{display:none}
.att-row .att-name{font-weight:600;font-size:15px;color:var(--tx)}
.att-row .att-check{width:28px;height:28px;border-radius:8px;border:2px solid var(--bd);display:grid;place-items:center;color:transparent;background:var(--card);flex:none;transition:all .15s}
.att-row.checked .att-check{background:var(--pri);border-color:var(--pri);color:#fff}
.att-meta{display:flex;align-items:center;gap:6px;margin-top:3px}

/* Progress bar & dots */
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lo);margin-right:2px;vertical-align:middle}
.dot.x{background:transparent;border:2px solid var(--hi)}
.q{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);align-items:center}
.q:last-child{border-bottom:0}

/* Friendly Empty States */
.empty-state{text-align:center;padding:28px 16px;background:var(--bg);border:1px dashed var(--bd);border-radius:12px;margin:12px 0}
.empty-state .ic{width:36px;height:36px;color:var(--mut);margin-bottom:8px}
.empty-state h3{font-size:16px;color:var(--nv);margin:0 0 4px}
.empty-state p{font-size:13px;color:var(--mut);margin:0 0 14px}
.empty-state button{margin:0 auto}

/* Animated Loading Skeletons */
.skeleton-box{padding:16px;background:var(--bg);border-radius:12px;margin:10px 0}
.skeleton-line{height:14px;background:var(--bd);border-radius:6px;margin-bottom:8px}
.skeleton-line.w-75{width:75%}
.skeleton-line.w-50{width:50%}
.pulse{animation:pulse 1.5s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.95}}

/* Voice wave */
.wave{display:none;gap:4px;align-items:flex-end;height:28px;margin:10px 0}.wave.on{display:flex}
.wave i{width:5px;height:6px;background:var(--pri);border-radius:3px;animation:w 1s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes w{0%,100%{height:6px}50%{height:26px}}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#0f172a;color:#ffffff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;display:flex;align-items:center;gap:8px}
.toast.s{opacity:1;transform:translateX(-50%) translateY(-4px)}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;padding:4px 0}
</style></head><body>
<header id="top">
  <button onclick="document.body.classList.toggle('menu')" aria-label="Open navigation menu" class="btn g sm" id="menuBtn"></button>
  <b>Sarthi</b>
  <span class="mut" style="font-size:13px">Magic Bus · Mankhurd</span>
</header>
<aside id="sb" aria-label="Sidebar navigation"></aside>
<nav id="bn" aria-label="Bottom navigation"></nav>
<main id="app"></main>
<div id="t" class="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Real inline SVG icon library */
const I={
  bus:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="3"/><circle cx="7.5" cy="19.5" r="1.5"/><circle cx="16.5" cy="19.5" r="1.5"/><path d="M3 10h18M7 4v3M17 4v3M7 15h2M15 15h2"/></svg>`,
  home:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  users:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  community:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M8 10h.01M16 10h.01M12 10h.01M8 14h.01M16 14h.01M12 14h.01"/></svg>`,
  checkCircle:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
  alertTriangle:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  chat:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
  calendar:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  map:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>`,
  mic:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`,
  feedback:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>`,
  book:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  reports:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><path d="M3 20h18"/></svg>`,
  phone:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
  sparkles:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.912 5.885L19.798 10.8 13.912 12.715 12 18.6l-1.912-5.885L4.202 10.8l5.886-1.915L12 3zM19 16l.956 2.943L22.899 19.9l-2.943.957L19 23.8l-.956-2.943L15.101 19.9l2.943-.957L19 16z"/></svg>`,
  copy:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
  plus:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  arrowRight:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`,
  chevronDown:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>`,
  userMinus:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/></svg>`,
  userCheck:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>`,
  refresh:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  shieldAlert:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  check:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>`,
  cross:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  menu:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>`,
  collapse:`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>`
};

/* Status & Risk badge helper: Color + Icon + Word */
function riskBadge(level){
  const icon = level === 'High' ? I.alertTriangle : level === 'Medium' ? I.shieldAlert : I.checkCircle;
  return `<span class="badge ${level}" role="status">${icon} ${level} risk</span>`;
}
function statusBadge(status){
  let icon = I.checkCircle, cls = 'Active';
  if(status === 'Dropped out'){ icon = I.userMinus; cls = 'Dropped'; }
  else if(status === 'At risk'){ icon = I.alertTriangle; cls = 'High'; }
  else if(status === 'Re-engaged'){ icon = I.refresh; cls = 'ReEngaged'; }

let EX=[];
function rx(t){
  return t.split(/[.\n।]+/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const l=s.toLowerCase();
    const b=B.find(x=>l.includes(x.n.toLowerCase()))||B.find(x=>l.includes(x.n.split(' ')[0].toLowerCase()));
    const k=Object.keys(C).find(k=>l.includes(C[k].n.toLowerCase()))||(b&&b.c);
    const isReg=/regist|enrol|join/.test(l);let regName='';
    if(isReg&&!b){
      const m=s.match(/(?:regist\w*|enrol\w*|join\w*)\s+(?:a\s+)?(?:new\s+)?(?:child\s+|girl\s+|boy\s+|student\s+|beneficiary\s+|youth\s+)?([A-Za-z\p{L}]+(?:\s+[A-Za-z\p{L}]+)?)/iu);
      if(m){
        let cand=m[1].trim().replace(/\b(in|at|from|today|yesterday|now)\b.*/i,'').trim();
        Object.values(C).forEach(c=>{cand=cand.replace(new RegExp('\\b'+c.n+'\\b','gi'),'').trim()});
        if(cand.length>1)regName=cand.split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
      }
    }
    return{
      ty:/refus|not interested|declin/.test(l)?'Refusal':isReg?'Registration':/follow|call back|come back|again/.test(l)?'Follow-up':'Visit',
      who:b?b.n:(regName||'(no match)'),
      c:k?C[k].n:'—',
      s,
      id:b?b.id:-1,
      regName
    };
  });
}

function svx(){
  const btn=$('#svxBtn');if(!btnLock(btn))return;
  const selM=+$('#fm').value,defComm=(M[selM]&&M[selM].c)||Object.keys(C)[0];
  document.querySelectorAll('.ek:checked').forEach(x=>{
    const e=EX[+x.value];
    e.m=selM;
    e.ts=Date.now();
    if(e.ty=='Registration'&&e.id<0){
      const ck=Object.keys(C).find(k=>C[k].n==e.c)||defComm;
      let name=e.regName;
      if(!name){
        const mt=e.s.match(/(?:regist\w*|enrol\w*|join\w*)\s+(?:a\s+)?(?:new\s+)?(?:child\s+|girl\s+|boy\s+|student\s+|beneficiary\s+|youth\s+)?([A-Za-z\p{L}]+(?:\s+[A-Za-z\p{L}]+)?)/iu);
        if(mt){
          let cand=mt[1].trim().replace(/\b(in|at|from|today|yesterday|now)\b.*/i,'').trim();
          Object.values(C).forEach(c=>{cand=cand.replace(new RegExp('\\b'+c.n+'\\b','gi'),'').trim()});
          if(cand.length>1)name=cand.split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
        }
      }
      if(!name&&e.who&&e.who!=='(no match)')name=e.who;
      if(name&&ck){
        e.id=mk({n:name,c:ck,rf:'Mobilizer visit'});
        e.who=name;
        e.c=C[ck].n;
      }
    }
    LOG.push(e);
    add('visits',e);
    if(e.id>=0){
      const b=B.find(z=>z.id===e.id)||B[e.id];
      if(b){b.lcd=Date.now();sv('people/p'+b.id,{lcd:b.lcd});}
    }
  });
  toast(live?'Saved to database':'Saved locally (demo mode)');
  go();
}

    const x=B.filter(b=>b.c==k),mb=M.find(m=>m.c==k),th=themes(k),up=SS.filter(s=>s.c==k&&s.w>=Date.now()-DAY).sort((a,b)=>a.w-b.w)[0],n=s=>x.filter(b=>st(b)==s).length;
    return `
    <details class="card">
      <summary style="justify-content:space-between">
        <div><b>${C[k].n}</b> <span class="badge Neutral">${x.length} enrolled</span></div>
        <span class="mut">${cavg(k)}% attendance · ${cov(k)}% coverage</span>
      </summary>
      <div style="padding-top:10px;border-top:1px solid var(--bd);margin-top:8px">
        <p class="mut"><b>Age group:</b> ${C[k].age} · <b>Interests:</b> ${C[k].int.join(', ')} · <b>Issues:</b> ${C[k].iss}</p>
        <p><b>Mobilizer:</b> ${mb?esc(mb.n):'None assigned'}<br>
          <span class="mut">Active: <b>${n('Active')}</b> · At risk: <b>${n('At risk')}</b> · Re-engaged: <b>${n('Re-engaged')}</b> · Dropped: <b>${n('Dropped out')}</b></span>
        </p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">
          ${Object.entries(th).map(e=>`<span class="badge High">${I.alertTriangle} ${e[0]} ×${e[1]}</span>`).join('')||'<span class="badge Neutral">No objections recorded</span>'}
        </div>
        <p class="mut">${I.calendar} <b>Next session:</b> ${up?esc(up.f)+' on '+new Date(up.w).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'None scheduled'}</p>
        <div style="margin:10px 0">
          ${x.slice(0,5).map(b=>`<div class="q"><span>${esc(b.n)}</span><span>${riskBadge(risk(b).level)}</span></div>`).join('')}
        </div>
        <button class="g sm" onclick="pc='${k}';location.hash='planner'">${I.calendar} Plan a session for ${C[k].n}</button>
      </div>
    </details>`;
  }).join('')}`;
}

function rb(){
  const col=(t,f,badgeType,cardClass)=>{
    const x=B.filter(f).sort((a,b)=>risk(b).s-risk(a).s);
    return `
    <div class="card ${cardClass||''}">
      <h2><span class="badge ${badgeType}">${badgeType==='High'?I.alertTriangle:badgeType==='Medium'?I.shieldAlert:badgeType==='ReEngaged'?I.refresh:I.userMinus} ${t}</span> (${x.length})</h2>
      ${x.length?x.map(b=>{
        const r=risk(b),m=mob(b);
        const isHigh=!b.d&&r.level==='High';
        return `
        <div class="q ${isHigh?'high-risk-highlight':''}" style="display:block;padding:12px;border-radius:10px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <b>${esc(b.n)}</b>
            <span class="badge Neutral">Score ${r.s}</span>
          </div>
          <span class="mut">${C[b.c]?C[b.c].n:b.c} · ${m?esc(m.n):'No mobilizer assigned'}</span>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0">
            ${r.r.map(z=>`<span class="badge High" style="font-size:11px">${I.alertTriangle} ${esc(z)}</span>`).join('')||'<span class="mut" style="font-size:12px">Regular participation</span>'}
          </div>
          <button class="g sm" onclick="act(${b.id})" style="margin-top:6px">${I.users} Take action</button>
        </div>`;
      }).join(''):`
        <div class="empty-state">
          ${I.checkCircle}
          <h3>No beneficiaries</h3>
          <p class="mut">No records currently under this category.</p>
        </div>
      `}
    </div>`;
  };

  return `<h1>Risk Board</h1>
  <p class="mut">Early-warning indicators prioritize youth needing proactive mobilizer engagement.</p>
  <div class="cols">
    ${col('High Risk: Act now',b=>!b.d&&risk(b).level=='High','High','high-risk-highlight')}
    ${col('Medium Risk: Watchlist',b=>!b.d&&risk(b).level=='Medium','Medium')}
    ${col('Re-engaged',b=>st(b)=='Re-engaged','ReEngaged')}
    ${col('Dropped Out',b=>!!b.d,'Dropped')}
  </div>`;
}

const cm=()=>{const d=$('#md');if(d)d.remove()};
function act(i){
  cm();const b=B.find(x=>x.id===i)||B[i];if(!b)return;
  const m=mob(b),d=document.createElement('div');
  d.id='md';d.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,0.7);display:grid;place-items:center;z-index:20;padding:16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)';
  d.innerHTML=`
  <div class="card" style="max-width:440px;width:100%;box-shadow:var(--sh-lg);border-radius:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0">${esc(b.n)}</h2>
      <button class="g sm" onclick="cm()" aria-label="Close dialog" style="min-height:36px;padding:4px 8px">${I.cross}</button>
    </div>
    <div style="margin-bottom:10px">${statusBadge(st(b))} ${riskBadge(risk(b).level)}</div>
    <p class="mut">${risk(b).r.map(z=>esc(z)).join('; ')||'No risk indicators'}</p>
    <button onclick="selB=${b.id};location.hash='messages';cm()" style="width:100%;margin:12px 0 8px">${I.chat} Draft outreach message</button>
    <label class="mut">Assigned field mobilizer</label>
    <select onchange="asg(${b.id},this.value)" aria-label="Assign mobilizer">
      ${M.map(x=>`<option value="${x.i}" ${m&&m.i==x.i?'selected':''}>${esc(x.n)}</option>`).join('')}
    </select>
  </div>`;
  document.body.appendChild(d);
}

function asg(i,v){
  const b=B.find(x=>x.id===i)||B[i];
  if(b){b.mob=+v;sv('people/p'+b.id,{mob:+v});}
  toast(live?'Mobilizer assigned':'Assigned locally (demo mode)');
}

const mapSvg=()=>{
  const K=Object.keys(C),P=k=>{const i=K.indexOf(k);return[12+(i%2)*195,12+Math.floor(i/2)*100]};
  return `
  <svg viewBox="0 0 410 ${Math.ceil(K.length/2)*100+16}" style="width:100%;max-width:580px;height:auto" role="img" aria-label="Schematic map of Mankhurd community pockets">
    ${Object.keys(C).map(k=>{
      const c=cov(k),f=c>=70?'#166534':c>=40?'#854d0e':'#991b1b',p=P(k),v=LOG.filter(x=>x.c==C[k].n&&x.ts>Date.now()-14*DAY).slice(0,8);
      return `
      <rect x="${p[0]}" y="${p[1]}" width="186" height="88" rx="12" fill="var(--card)" stroke="${f}" stroke-width="2"></rect>
      <text x="${p[0]+12}" y="${p[1]+26}" font-size="14" font-weight="700" fill="var(--nv)">${C[k].n}</text>
      <text x="${p[0]+12}" y="${p[1]+46}" font-size="12" fill="var(--mut)">${c}% covered</text>
      ${v.map((x,i)=>`<circle cx="${p[0]+18+i*16}" cy="${p[1]+68}" r="5" fill="var(--pri)"></circle>`).join('')}`;
    }).join('')}
  </svg>`;
};

function kb(){
  return `<h1>Knowledge Base</h1>
  <div class="card">
    <input id="kq" placeholder="Ask about Magic Bus playbooks, OASYS guidelines, attendance rules…" onkeydown="if(event.key==='Enter')askKB()" aria-label="Knowledge base query">
    <button onclick="askKB()" id="askBtn">${I.sparkles} Search guidelines</button>
    <div id="ka"></div>
  </div>

  <div class="card">
    <h2>Documents (${KB.length})</h2>
    <p class="mut">Verified operating guidelines powering the Sarthi offline search and assistant.</p>
    ${KB.map(d=>`
      <div style="padding:10px 0;border-bottom:1px solid var(--bd)">
        <b>${esc(d.t)}</b><br>
        <span class="mut">${esc(d.x.slice(0,120))}…</span>
      </div>
    `).join('')}

    <details style="margin-top:14px">
      <summary><b>${I.plus} Add new reference document</b></summary>
      <div style="margin-top:10px">
        <input id="kt" placeholder="Document title *">
        <textarea id="kx" placeholder="Paste guidelines, operating procedures, or session toolkits text…"></textarea>
        <button onclick="addKB()" id="addKbBtn">${I.plus} Save document</button>
      </div>
    </details>
  </div>`;
}

async function askKB(){
  const btn=$('#askBtn');if(!btnLock(btn))return;
  const q=$('#kq').value.trim(),el=$('#ka');if(!q)return;
  const sw=['the','and','what','how','are','for','does','with','this','that','from','can','when'],
        w=q.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(z=>z.length>2&&!sw.includes(z)),
        r=KB.flatMap(d=>d.x.split(/\n+/).filter(p=>p.trim().length>20).map(p=>({t:d.t,x:p.trim()}))).map(c=>({...c,s:w.filter(z=>(c.t+' '+c.x).toLowerCase().includes(z)).length})).filter(c=>c.s>0).sort((a,b)=>b.s-a.s).slice(0,3);

  if(!r.length){
    el.innerHTML=`
      <div class="empty-state">
        ${I.book}
        <h3>No matching passages found</h3>
        <p class="mut">Try searching for words like "safety", "playbook", "OASYS", "attendance", or add a new document below.</p>
      </div>`;
    return;
  }

  const src=r.map(c=>`<p class="mut" style="padding:6px 0;border-bottom:1px solid var(--bd)"><b>[${esc(c.t)}]:</b> ${esc(c.x)}</p>`).join('');
  if(!SA){
    el.innerHTML=`<div class="card" style="margin-top:12px"><h3>Matching guidelines:</h3>${src}</div>`;
    return;
  }
  el.innerHTML=`
    <div class="skeleton-box">
      <div class="skeleton-line pulse"></div>
      <div class="skeleton-line pulse w-75"></div>
      <p class="mut" style="display:flex;align-items:center;gap:6px">${I.sparkles} Synthesizing answer from guidelines...</p>
    </div>`;
  try{
    const x=await SA(`Answer using ONLY passages below. Cite [Doc title].\nQuestion: ${q}\n\n`+r.map((c,i)=>`Passage ${i+1} [${c.t}]: ${c.x}`).join('\n'),{cache:false});
    el.innerHTML=`<div class="card" style="margin-top:12px"><p>${esc(x.text.trim()).replace(/\n/g,'<br>')}</p><details style="margin-top:8px"><summary class="mut">${I.book} Source passages</summary>${src}</details></div>`;
  }catch(e){
    el.innerHTML=`<div class="card" style="margin-top:12px"><h3>Matching guidelines:</h3>${src}</div>`;
  }
}

function addKB(){
  const btn=$('#addKbBtn');if(!btnLock(btn))return;
  const t=$('#kt').value.trim(),x=$('#kx').value.trim();if(!t||!x)return toast('Add a title and document text');
  const d={t,x};KB.push(d);add('kb',d);toast(live?'Document saved':'Saved locally (demo mode)');go();
}

const V={dashboard:dash,people,attendance:att,planner:plan,messages:msg,field,feedback:fb,team,reports:rep,communities:comm,risk:rb,kb};

function go(){
  const h=(location.hash||'#dashboard').slice(1),v=V[h]?h:'dashboard';
  cm();
  $('#menuBtn').innerHTML=I.menu;
  $('#sb').innerHTML=`
    <div class="br">
      <div class="lg">${I.bus}</div>
      <div><b>Sarthi</b><span>Magic Bus · Mankhurd</span></div>
    </div>`+SB.map(n=>`
      <a href="#${n[0]}" class="${n[0]==v?'on':''}">
        ${n[2]}<span class="l">${n[1]}</span>
      </a>
    `).join('')+`
    <button onclick="document.body.classList.toggle('col')">${I.collapse} <span class="l">Collapse sidebar</span></button>`;
  
  $('#bn').innerHTML=NAV.map(n=>`
    <a href="#${n[0]}" class="${n[0]==v?'on':''}">
      ${n[1]}<span>${n[2]}</span>
    </a>
  `).join('');

  document.body.classList.remove('menu');
  $('#app').innerHTML=V[v]();
  if(v=='people')lst();
  if(v=='messages')gen();
}

addEventListener('hashchange',()=>{go();scrollTo(0,0)});
go();boot();
</script></body></html>
